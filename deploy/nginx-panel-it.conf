# nginx para el Panel IT. Copiar a /etc/nginx/sites-available/panel-it, cambiar el dominio
# y activar con:  ln -s /etc/nginx/sites-available/panel-it /etc/nginx/sites-enabled/
# Después:  nginx -t && systemctl reload nginx  y  certbot --nginx -d it.bagsstore.com.ar
# (certbot agrega solo el bloque de HTTPS y la redirección).
server {
    listen 80;
    server_name it.bagsstore.com.ar;

    client_max_body_size 1m;          # las imágenes van directo a Cloudinary, no pasan por acá

    location / {
        proxy_pass http://127.0.0.1:3080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;   # el panel usa esta IP en Actividad y en el bloqueo de intentos
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
